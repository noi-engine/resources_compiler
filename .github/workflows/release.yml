name: release

# Publishes resources_compiler.zip, the file the editor downloads (and that a game's CI downloads)
# for the version a project declares in "resources_compiler_version":
#
#   resources_compiler/
#     ResourcesCompiler.cmake
#     requirements.txt
#     scripts/
#
# Tag with the version only ("v0.0.106"), then bump resources_compiler_version in
# template-basic-2d (noi_engine.template.json) to use it.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (ex: v0.0.106)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist/resources_compiler
          cp -r ResourcesCompiler.cmake requirements.txt scripts dist/resources_compiler/
          find dist -name __pycache__ -type d -prune -exec rm -rf {} +
          (cd dist && zip -r ../resources_compiler.zip resources_compiler)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
          name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
          generate_release_notes: true
          files: resources_compiler.zip
